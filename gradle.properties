#Kotlin
kotlin.code.style=official
# Compile Kotlin inside the Gradle daemon: no second daemon process, so memory stays predictable.
kotlin.compiler.execution.strategy=in-process

#Gradle
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# No lasting daemon: each build JVM exits at the end, so parallel agents do not fill memory.
org.gradle.daemon=false
org.gradle.configuration-cache=true
org.gradle.caching=true
